name: iOS IPA bauen

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Unsignierte IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Build ohne Signierung
        run: |
          set -o pipefail
          xcodebuild \
            -project SensorLab.xcodeproj \
            -scheme SensorLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: IPA packen
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SensorLab.app Payload/
          zip -r SensorLab-unsigned.ipa Payload

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SensorLab-unsigned-ipa
          path: SensorLab-unsigned.ipa
          if-no-files-found: error
